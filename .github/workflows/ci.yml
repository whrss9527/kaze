name: ci

# 推送代码和合并请求时：编译、单元测试、打包 .app，启动一次并截图（产物里有截图，日志里也有 base64 版本）。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  macos:
    name: 编译、测试、打包
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 选择最新的 Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
      - name: 编译
        run: swift build
      - name: 单元测试
        run: |
          # 顺便把菜单栏图标各种状态的对照图画出来，最后一步打进日志。
          mkdir -p screenshots
          PROXYSWITCH_ICON_PREVIEW_DIR="$PWD/screenshots" swift test
      - name: 缓存内核下载
        uses: actions/cache@v4
        with:
          path: .core-cache
          key: core-${{ hashFiles('Scripts/build-app.sh') }}
      - name: 打包 .app（本机架构）
        run: |
          VERSION=0.0.0 ARCHS="" THIN_ARCHIVES=1 Scripts/build-app.sh
          [ -f dist/ProxySwitch-macos-arm64.zip ] || { echo "没有生成 arm64 精简包"; exit 1; }
          lipo -archs dist/thin-arm64/ProxySwitch.app/Contents/MacOS/mihomo
          [ "$(lipo -archs dist/thin-arm64/ProxySwitch.app/Contents/MacOS/mihomo)" = "arm64" ] || { echo "精简包里的内核不是单架构"; exit 1; }
          ls -la dist/*.zip
      - name: 冒烟启动并截图
        run: |
          support="$HOME/Library/Application Support/ProxySwitch"
          mkdir -p "$support" screenshots
          # 预置几套配置，面板里有内容可看。
          cat > "$support/config.json" <<'JSON'
          {"profiles":[{"id":"6D2F2A1E-0000-4000-8000-000000000001","name":"Clash","color":"#16a34a","kind":"http","host":"127.0.0.1","port":7890},
                       {"id":"6D2F2A1E-0000-4000-8000-000000000002","name":"公司代理","color":"#2563eb","kind":"http","host":"proxy.corp.example","port":3128},
                       {"id":"6D2F2A1E-0000-4000-8000-000000000003","name":"SOCKS 隧道","color":"#7c3aed","kind":"socks5","host":"127.0.0.1","port":1080}]}
          JSON
          # 本地假订阅：三个节点的 base64 列表，内核会去下载解析。
          mkdir -p feed0
          python3 - <<'PY'
          import base64, urllib.parse
          uris = [f"ss://YWVzLTEyOC1nY206cGFzc3dvcmQ=@127.0.0.1:{port}#{urllib.parse.quote(name)}" for port, name in [(8388, "测试节点A"), (8389, "测试节点B")]]
          uris.append("trojan://password@example.com:443#" + urllib.parse.quote("测试节点C"))
          open("feed0/sub.txt", "w").write(base64.b64encode("\n".join(uris).encode()).decode())
          PY
          # 假装 iCloud 云盘里已经有另一台 Mac 同步上来的配置（多一套「iCloud 来的」），并且本机记录着同步已开启。
          cloud="$RUNNER_TEMP/fake-icloud"
          mkdir -p "$cloud"
          cat > "$cloud/config.json" <<'JSON'
          {"format":1,"updatedAt":"2026-09-24T00:00:00Z","device":"另一台 Mac",
           "config":{"profiles":[{"id":"6D2F2A1E-0000-4000-8000-000000000001","name":"Clash","color":"#16a34a","kind":"http","host":"127.0.0.1","port":7890},
                                 {"id":"6D2F2A1E-0000-4000-8000-000000000002","name":"公司代理","color":"#2563eb","kind":"http","host":"proxy.corp.example","port":3128},
                                 {"id":"6D2F2A1E-0000-4000-8000-000000000003","name":"SOCKS 隧道","color":"#7c3aed","kind":"socks5","host":"127.0.0.1","port":1080},
                                 {"id":"6D2F2A1E-0000-4000-8000-000000000004","name":"iCloud 来的","color":"#db2777","kind":"http","host":"10.0.0.8","port":8888}],
                     "engine":{"subscriptions":[{"id":"6D2F2A1E-0000-4000-8000-00000000000A","name":"测试机场","url":"file://SUBFILE"}],"mode":"rule"}}}
          JSON
          # runner 上未签名程序连本机端口会被系统的「本地网络」权限拦住（超时），所以 CI 里用本机文件当订阅。
          sed -i '' "s|file://SUBFILE|file://$(pwd)/feed0/sub.txt|" "$cloud/config.json"
          # 本机状态里同时开着局域网共享：内核会在 0.0.0.0:7892 多开一个给 PS5 这类设备用的入口。
          echo '{"syncEnabled":true,"share":{"enabled":true,"port":7892}}' > "$support/state.json"
          echo "PROXYSWITCH_SYNC_DIR=$cloud" >> "$GITHUB_ENV"
          # 直接运行 .app 里的二进制，环境变量才能传进去；系统仍把它当作 dist/ProxySwitch.app 在运行，proxyswitch:// 命令照常送达。
          PROXYSWITCH_SYNC_DIR="$cloud" dist/ProxySwitch.app/Contents/MacOS/ProxySwitch >/dev/null 2>&1 &
          sleep 8
          if ! pgrep -x ProxySwitch >/dev/null; then
            echo "程序没有在运行"
            cat "$support/proxyswitch.log" || true
            exit 1
          fi
          # 面板打开前先拍一张整屏，留着裁出菜单栏右半边看图标和网速。
          screencapture -x screenshots/desktop.png || true
          open "proxyswitch://panel"; sleep 3
          screencapture -x screenshots/panel.png || true
          open "proxyswitch://settings"; sleep 4
          screencapture -x screenshots/settings.png || true
          open "proxyswitch://settings?page=sync"; sleep 3
          screencapture -x screenshots/sync.png || true
          # 内核应该已经跟着假订阅启动，并读到 3 个节点。
          for i in $(seq 1 20); do
            grep -q "读取到 3 个节点" "$support/proxyswitch.log" && break
            sleep 1
          done
          open "proxyswitch://settings?page=nodes"; sleep 3
          screencapture -x screenshots/nodes.png || true
          # 局域网共享的入口应该已经监听起来；本机没开代理，所以经它出去的流量直连。
          for i in $(seq 1 20); do
            grep -q "局域网共享已开启" "$support/proxyswitch.log" && break
            sleep 1
          done
          open "proxyswitch://settings?page=share"; sleep 3
          screencapture -x screenshots/share.png || true
          share_code=$(curl -s -m 15 -x http://127.0.0.1:7892 -o /dev/null -w '%{http_code}' https://cp.cloudflare.com/generate_204 || true)
          echo "经共享端口访问外网：$share_code"
          # 网址诊断：本机没开代理，应该得出「直连正常」之类的结论并写进日志。
          open "proxyswitch://diagnose?url=https://cp.cloudflare.com/generate_204"
          for i in $(seq 1 40); do
            grep -q "诊断完成" "$support/proxyswitch.log" && break
            sleep 1
          done
          sleep 2
          screencapture -x screenshots/diagnose.png || true
          # 经内核的代理端口访问外网（假节点都连不上，自动选择会退回 DIRECT）。
          echo "经内核访问外网：$(curl -s -m 10 -x http://127.0.0.1:7890 -o /dev/null -w '%{http_code}' https://cp.cloudflare.com/generate_204 || true)"
          echo "===== 内核配置 ====="; cat "$support/core/config.yaml" | head -60
          echo "===== 内核日志 ====="; cat "$support/core/core.log" || true
          echo "===== 程序日志 ====="; cat "$support/proxyswitch.log" || true
          grep -q "应用了来自 另一台 Mac 的配置" "$support/proxyswitch.log" || { echo "没有从假 iCloud 拉到配置"; exit 1; }
          grep -q "iCloud 来的" "$support/config.json" || { echo "拉到的配置没有写到本机"; cat "$support/config.json"; exit 1; }
          grep -q "内核已启动" "$support/proxyswitch.log" || { echo "内核没有启动"; exit 1; }
          grep -q "读取到 3 个节点" "$support/proxyswitch.log" || { echo "没有读到假订阅的 3 个节点"; exit 1; }
          grep -q '"name":"节点代理"' "$support/config.json" || grep -q '"name" : "节点代理"' "$support/config.json" || { echo "没有自动加上「节点代理」配置"; exit 1; }
          grep -q "局域网共享已开启" "$support/proxyswitch.log" || { echo "局域网共享没有开启"; exit 1; }
          grep -q 'name: "lan-share"' "$support/core/config.yaml" || { echo "内核配置里没有共享入口"; exit 1; }
          grep -q 'MATCH,DIRECT' "$support/core/config.yaml" || { echo "本机没开代理，共享入口应该直连"; exit 1; }
          grep -q '^sniffer:' "$support/core/config.yaml" || { echo "内核配置里没有开域名嗅探"; exit 1; }
          # 共享开着时应该在阻止空闲睡眠（runner 没有电池，算接电源）。
          pmset -g assertions | grep -q "ProxySwitch" || { pmset -g assertions; echo "共享期间没有阻止睡眠"; exit 1; }
          grep -q "诊断完成：cp.cloudflare.com" "$support/proxyswitch.log" || { echo "网址诊断没有跑完"; exit 1; }
          nc -z 127.0.0.1 7892 || { echo "共享端口没有监听"; exit 1; }
          pkill -x ProxySwitch || true
          sleep 3
          pgrep -x mihomo && { echo "程序退出后内核还在运行"; exit 1; }
          ls -la screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: ProxySwitch-macos
          path: dist/ProxySwitch-macos.zip
      - name: 端到端更新测试（本地假发布）
        run: |
          support="$HOME/Library/Application Support/ProxySwitch"
          # 留一份原版，后面测「从临时位置运行」时用。
          rm -rf relocate-src && mkdir -p relocate-src && ditto dist/ProxySwitch.app relocate-src/ProxySwitch.app
          # 用打包好的程序造一个 9.9.9 版本，放到本地 HTTP 服务器上当作 GitHub 的最新发布：通用包和 arm64 精简包各一份。
          rm -rf feed && mkdir -p feed
          cp -R dist/ProxySwitch.app feed/ProxySwitch.app
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 9.9.9" feed/ProxySwitch.app/Contents/Info.plist
          codesign --force --deep --sign - feed/ProxySwitch.app
          (cd feed && ditto -c -k --keepParent ProxySwitch.app ProxySwitch-macos.zip && cp ProxySwitch-macos.zip ProxySwitch-macos-arm64.zip && rm -rf ProxySwitch.app \
            && shasum -a 256 ProxySwitch-macos.zip ProxySwitch-macos-arm64.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          size=$(stat -f %z feed/ProxySwitch-macos.zip)
          cat > feed/latest.json <<JSON
          {"tag_name":"v9.9.9","html_url":"http://127.0.0.1:8765/latest.json","published_at":"2026-01-01T00:00:00Z",
           "body":"## 9.9.9\n\n- 这是 CI 里用来测试一键更新的假版本。\n- 下载、校验、替换、重新启动都会走一遍。",
           "assets":[{"name":"ProxySwitch-macos.zip","size":$size,"browser_download_url":"http://127.0.0.1:8765/ProxySwitch-macos.zip"},
                     {"name":"ProxySwitch-macos-arm64.zip","size":$size,"browser_download_url":"http://127.0.0.1:8765/ProxySwitch-macos-arm64.zip"},
                     {"name":"SHA256SUMS.txt","size":100,"browser_download_url":"http://127.0.0.1:8765/SHA256SUMS.txt"}]}
          JSON
          (cd feed && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          curl -sf http://127.0.0.1:8765/latest.json >/dev/null
          : > "$support/proxyswitch.log"
          PROXYSWITCH_UPDATE_URL=http://127.0.0.1:8765/latest.json dist/ProxySwitch.app/Contents/MacOS/ProxySwitch >/dev/null 2>&1 &
          # 启动 5 秒后自动检查，等它发现新版本。
          for i in $(seq 1 20); do
            grep -q "有新版本 9.9.9" "$support/proxyswitch.log" && break
            sleep 1
          done
          open "proxyswitch://settings?page=about"; sleep 4
          screencapture -x screenshots/about.png || true
          open "proxyswitch://panel"; sleep 3
          screencapture -x screenshots/panel-update.png || true
          open "proxyswitch://update"
          # 等下载、替换和重新启动完成。
          version=""
          for i in $(seq 1 60); do
            version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/ProxySwitch.app/Contents/Info.plist 2>/dev/null || true)
            if [ "$version" = "9.9.9" ] && grep -q "已启动，版本 9.9.9" "$support/proxyswitch.log"; then break; fi
            sleep 1
          done
          sleep 3
          open "proxyswitch://settings?page=about"; sleep 4
          screencapture -x screenshots/about-after.png || true
          echo "===== 日志 ====="
          cat "$support/proxyswitch.log" || true
          echo "================"
          [ "$version" = "9.9.9" ] || { echo "程序没有被替换成 9.9.9（现在是 $version）"; exit 1; }
          grep -q "已启动，版本 9.9.9" "$support/proxyswitch.log" || { echo "新版本没有重新启动"; exit 1; }
          grep -q "下载 http://127.0.0.1:8765/ProxySwitch-macos-arm64.zip" "$support/proxyswitch.log" || { echo "没有下载本机架构的精简包"; exit 1; }
          pgrep -x ProxySwitch >/dev/null || { echo "更新后程序没有在运行"; exit 1; }
          codesign --verify --deep --strict dist/ProxySwitch.app
          ls -la dist
          pkill -x ProxySwitch || true
          sleep 3
          rm -rf dist/ProxySwitch.app

          # 再模拟「在下载文件夹里直接打开、被系统搬到只读的临时位置运行」：更新应该装进「应用程序」、旧的那份移到废纸篓、从新位置重新打开。
          rm -rf /Applications/ProxySwitch.app
          : > "$support/proxyswitch.log"
          PROXYSWITCH_UPDATE_URL=http://127.0.0.1:8765/latest.json PROXYSWITCH_TEST_TRANSLOCATED=1 relocate-src/ProxySwitch.app/Contents/MacOS/ProxySwitch >/dev/null 2>&1 &
          for i in $(seq 1 20); do
            grep -q "有新版本 9.9.9" "$support/proxyswitch.log" && break
            sleep 1
          done
          app="$PWD/relocate-src/ProxySwitch.app"
          open -a "$app" "proxyswitch://settings?page=about"; sleep 4
          screencapture -x screenshots/about-relocate.png || true
          open -a "$app" "proxyswitch://update"
          version=""
          for i in $(seq 1 60); do
            version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /Applications/ProxySwitch.app/Contents/Info.plist 2>/dev/null || true)
            if [ "$version" = "9.9.9" ] && grep -q "已启动，版本 9.9.9" "$support/proxyswitch.log"; then break; fi
            sleep 1
          done
          sleep 3
          echo "===== 日志（从临时位置运行） ====="
          cat "$support/proxyswitch.log" || true
          echo "================"
          [ "$version" = "9.9.9" ] || { echo "没有装进「应用程序」（/Applications 里的版本是 $version）"; exit 1; }
          [ ! -e "$app" ] || { echo "旧的那份没有移到废纸篓"; exit 1; }
          grep -q "移到废纸篓" "$support/proxyswitch.log" || { echo "日志里没有移到废纸篓的记录"; exit 1; }
          pgrep -f "/Applications/ProxySwitch.app/Contents/MacOS/ProxySwitch" >/dev/null || { echo "没有从「应用程序」重新打开"; exit 1; }
          codesign --verify --deep --strict /Applications/ProxySwitch.app
          if xattr /Applications/ProxySwitch.app | grep -q com.apple.quarantine; then echo "新程序还带着隔离标记"; exit 1; fi
          pkill -x ProxySwitch || true
          sleep 2
          rm -rf /Applications/ProxySwitch.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
      - name: 把截图以 base64 打进日志
        if: always()
        run: |
          cd screenshots || exit 0
          if [ -f panel.png ]; then
            width=$(sips -g pixelWidth panel.png | awk '/pixelWidth/{print $2}')
            cropw=640; croph=760
            if ! sips -c "$croph" "$cropw" --cropOffset 0 $((width - cropw)) panel.png --out panel-crop.png >/dev/null 2>&1; then
              cp panel.png panel-crop.png
            fi
            sips -Z 560 -s format jpeg -s formatOptions 65 panel-crop.png --out panel.jpg >/dev/null
          fi
          if [ -f panel-update.png ]; then
            width=$(sips -g pixelWidth panel-update.png | awk '/pixelWidth/{print $2}')
            if ! sips -c 760 640 --cropOffset 0 $((width - 640)) panel-update.png --out panel-update-crop.png >/dev/null 2>&1; then
              cp panel-update.png panel-update-crop.png
            fi
            sips -Z 560 -s format jpeg -s formatOptions 65 panel-update-crop.png --out panel-update.jpg >/dev/null
          fi
          # 设置窗口居中，裁到窗口附近再缩小，日志里放得下、看得清。
          for name in settings sync nodes share diagnose about about-after about-relocate; do
            [ -f "$name.png" ] || continue
            width=$(sips -g pixelWidth "$name.png" | awk '/pixelWidth/{print $2}')
            height=$(sips -g pixelHeight "$name.png" | awk '/pixelHeight/{print $2}')
            cropw=$((width * 9 / 10)); croph=$((height * 17 / 20))
            if ! sips -c "$croph" "$cropw" --cropOffset $((height / 20)) $(((width - cropw) / 2)) "$name.png" --out "$name-crop.png" >/dev/null 2>&1; then
              cp "$name.png" "$name-crop.png"
            fi
            sips -Z 1000 -s format jpeg -s formatOptions 60 "$name-crop.png" --out "$name.jpg" >/dev/null
          done
          for name in settings sync nodes share diagnose about-after panel about panel-update about-relocate; do
            [ -f "$name.jpg" ] || continue
            echo "=====BEGIN $name.jpg====="
            base64 -b 76 -i "$name.jpg"
            echo "=====END $name.jpg====="
          done
          # 菜单栏右半边放大 4 倍，最后打出来，日志末尾一定能看到。
          if [ -f desktop.png ]; then
            width=$(sips -g pixelWidth desktop.png | awk '/pixelWidth/{print $2}')
            if sips -c 25 520 --cropOffset 0 $((width - 520)) desktop.png --out menubar-crop.png >/dev/null 2>&1; then
              sips -z 100 2080 menubar-crop.png --out menubar.png >/dev/null
              echo "=====BEGIN menubar.png====="
              base64 -b 76 -i menubar.png
              echo "=====END menubar.png====="
            fi
          fi
          if [ -f icon-preview.png ]; then
            sips -s format jpeg -s formatOptions 85 icon-preview.png --out icon-preview.jpg >/dev/null
            echo "=====BEGIN icon-preview.jpg====="
            base64 -b 76 -i icon-preview.jpg
            echo "=====END icon-preview.jpg====="
          fi
